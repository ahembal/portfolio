[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "p11-experiment-tracking"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"
