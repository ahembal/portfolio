[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "p12-data-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=2.9",
    "biopython>=1.83",
    "boto3>=1.34",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "s3fs>=2024.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"
