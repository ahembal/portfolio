apiVersion: batch/v1
kind: Job
metadata:
  name: p8-benchmark-${MODEL_ID}-${VERSION}
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: quick-thrush
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: benchmark
          image: ghcr.io/ahembal/p8-benchmark:latest
          args: ["${MODEL_ID}", "${VERSION}"]
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: ssh-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: p8-benchmark-ssh-key
            defaultMode: 0600
