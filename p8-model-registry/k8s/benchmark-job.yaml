apiVersion: batch/v1
kind: Job
metadata:
  name: p8-benchmark-${MODEL_ID}-${VERSION}
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      # Pin to quick-thrush — the actual serving node.
      # Benchmark numbers must match the serving environment.
      nodeSelector:
        kubernetes.io/hostname: quick-thrush
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: benchmark
          image: ghcr.io/ahembal/p8-benchmark:latest
          args: ["${MODEL_ID}", "${VERSION}"]
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
