apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahembal/portfolio.git
    targetRevision: HEAD
    path: cluster/manifests
    directory:
      recurse: false
      exclude: "argocd-cluster-manifests.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
