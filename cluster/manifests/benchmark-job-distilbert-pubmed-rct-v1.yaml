apiVersion: batch/v1
kind: Job
metadata:
  name: p8-benchmark-distilbert-pubmed-rct-v1-3
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: quick-thrush
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: benchmark
          image: ghcr.io/ahembal/p8-benchmark:latest
          args: ["distilbert-pubmed-rct", "v1"]
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          # RGW credentials — required for text model benchmarks that download
          # weights from Ceph RGW. Vision models pull from HuggingFace Hub and
          # do not need these. Set only when the model origin.type is "rgw".
          #
          # Create the secret before deploying:
          #   kubectl create secret generic p8-benchmark-rgw-credentials \
          #     --from-literal=endpoint=http://192.168.1.200 \
          #     --from-literal=access-key=<KEY> \
          #     --from-literal=secret-key=<SECRET>
          env:
            - name: RGW_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: p8-benchmark-distilbert-pubmed-rct-v1-3
                  key: endpoint
                  optional: true
            - name: RGW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: p8-benchmark-distilbert-pubmed-rct-v1-3
                  key: access-key
                  optional: true
            - name: RGW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: p8-benchmark-distilbert-pubmed-rct-v1-3
                  key: secret-key
                  optional: true
          volumeMounts:
            - name: ssh-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: p8-benchmark-ssh-key
            defaultMode: 0600
