apiVersion: batch/v1
kind: Job
metadata:
  name: p8-benchmark-distilbert-pubmed-rct-v1-4
  namespace: default
spec:
  # TTL is set long enough to investigate a failure (24h) but still auto-cleans
  # after success. A PrometheusRule alerts on failure so the window is sufficient.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: quick-thrush
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: benchmark
          image: ghcr.io/ahembal/p8-benchmark:latest
          args: ["distilbert-pubmed-rct", "v1"]
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          env:
            - name: RGW_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: p8-benchmark-rgw-credentials
                  key: endpoint
                  optional: true
            - name: RGW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: p8-benchmark-rgw-credentials
                  key: access-key
                  optional: true
            - name: RGW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: p8-benchmark-rgw-credentials
                  key: secret-key
                  optional: true
          volumeMounts:
            - name: ssh-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: p8-benchmark-ssh-key
            defaultMode: 0600
