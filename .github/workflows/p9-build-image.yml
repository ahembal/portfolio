name: p9 — Build graph builder image

on:
  push:
    branches: [main]
    paths:
      - p9-knowledge-graph/docker/Dockerfile
      - p9-knowledge-graph/docker/entrypoint.sh
      - p9-knowledge-graph/requirements.txt
      - p9-knowledge-graph/src/**
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ahembal/p9-graph-builder

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: p9-knowledge-graph
          file: p9-knowledge-graph/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
