name: p8 — Run benchmark

on:
  push:
    branches: [main]
    paths:
      - p8-model-registry/registry/models/**
  workflow_dispatch:
    inputs:
      model_id:
        description: Model ID from registry
        required: true
        default: resnet18-tiatoolbox-pcam
      version:
        description: Model version
        required: true
        default: v1

jobs:
  trigger-benchmark:
    name: Commit Job manifest — ArgoCD applies it
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set model targets
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "model_id=${{ inputs.model_id }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}"   >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- p8-model-registry/registry/models/ 2>/dev/null \
              || git show --name-only --format="" HEAD -- p8-model-registry/registry/models/ | head -1)
            MODEL_ID=$(basename "$CHANGED" .yaml | sed 's/-v[0-9]*$//')
            VERSION=$(basename "$CHANGED" .yaml | grep -o 'v[0-9]*$')
            echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT
            echo "version=$VERSION"   >> $GITHUB_OUTPUT
          fi

      - name: Generate and commit Job manifest
        run: |
          MODEL_ID=${{ steps.targets.outputs.model_id }}
          VERSION=${{ steps.targets.outputs.version }}
          RUN_ID=${{ github.run_number }}
          JOB_NAME="p8-benchmark-${MODEL_ID}-${VERSION}-${RUN_ID}"

          sed "s/\${MODEL_ID}/${MODEL_ID}/g; s/\${VERSION}/${VERSION}/g" \
            p8-model-registry/k8s/benchmark-job.yaml \
            | sed "s/name: p8-benchmark-.*/name: ${JOB_NAME}/" \
            > cluster/manifests/benchmark-job-${MODEL_ID}-${VERSION}.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cluster/manifests/benchmark-job-${MODEL_ID}-${VERSION}.yaml
          git diff --staged --quiet || git commit -m "ci(p8): trigger benchmark ${MODEL_ID} ${VERSION}"
          git pull --rebase && git push

          echo "Job manifest committed — ArgoCD will apply it to quick-thrush"
          echo "Results will appear in p8-model-registry/benchmarks/ once the Job completes"
