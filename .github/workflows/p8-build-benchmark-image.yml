name: p8 — Build benchmark image

on:
  push:
    branches: [main]
    paths:
      - p8-model-registry/docker/Dockerfile
      - p8-model-registry/requirements.txt
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ahembal/p8-benchmark

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: p8-model-registry
          file: p8-model-registry/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
