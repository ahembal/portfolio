name: p8 — Model Benchmark

on:
  push:
    branches: [main]
    paths:
      - p8-model-registry/registry/models/**
      - p8-model-registry/docker/Dockerfile
      - p8-model-registry/requirements.txt
  workflow_dispatch:
    inputs:
      model_id:
        description: Model ID from registry
        required: true
        default: resnet18-tiatoolbox-pcam
      version:
        description: Model version
        required: true
        default: v1

env:
  IMAGE: ghcr.io/ahembal/p8-benchmark

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Build and push benchmark image
  # Only rebuilds when Dockerfile or requirements.txt change.
  # ---------------------------------------------------------------------------
  build-image:
    name: Build benchmark image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: p8-model-registry
          file: p8-model-registry/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2 — Run benchmark on quick-thrush via K8s Job
  # ---------------------------------------------------------------------------
  run-benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set model targets
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "model_id=${{ inputs.model_id }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}"   >> $GITHUB_OUTPUT
          else
            # On push: detect which model files changed
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- p8-model-registry/registry/models/ | head -1)
            MODEL_ID=$(basename "$CHANGED" .yaml | sed 's/-v[0-9]*$//')
            VERSION=$(basename "$CHANGED" .yaml | grep -o 'v[0-9]*$')
            echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT
            echo "version=$VERSION"   >> $GITHUB_OUTPUT
          fi

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Run benchmark Job
        run: |
          MODEL_ID=${{ steps.targets.outputs.model_id }}
          VERSION=${{ steps.targets.outputs.version }}
          JOB_NAME="p8-benchmark-${MODEL_ID}-${VERSION}-${{ github.run_number }}"

          sed "s/\${MODEL_ID}/${MODEL_ID}/g; s/\${VERSION}/${VERSION}/g" \
            p8-model-registry/k8s/benchmark-job.yaml \
            | sed "s/name: p8-benchmark-.*/name: ${JOB_NAME}/" \
            | kubectl apply -f -

          echo "Waiting for job ${JOB_NAME}..."
          kubectl wait --for=condition=complete job/${JOB_NAME} --timeout=600s

          echo "Fetching results..."
          kubectl logs job/${JOB_NAME} > /tmp/benchmark-output.txt
          cat /tmp/benchmark-output.txt

      - name: Save results to repo
        run: |
          MODEL_ID=${{ steps.targets.outputs.model_id }}
          VERSION=${{ steps.targets.outputs.version }}
          DATE=$(date +%Y-%m-%d)
          RESULT_FILE="p8-model-registry/benchmarks/${MODEL_ID}-${VERSION}-${DATE}.yaml"

          # Extract YAML from job output (starts at "id:" line)
          grep -A 100 "^id:" /tmp/benchmark-output.txt > "${RESULT_FILE}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${RESULT_FILE}"
          git diff --staged --quiet || git commit -m "ci(p8): benchmark ${MODEL_ID} ${VERSION} on quick-thrush"
          git pull --rebase && git push
