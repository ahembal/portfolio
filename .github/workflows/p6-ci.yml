name: p6-research-agent CI

on:
  push:
    branches: [main]
    paths:
      - "p6-research-agent/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p6-research-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: ruff check src/ tests/
      - run: pytest tests/ -v -m "not e2e"

  build-api:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        id: meta
        run: |
          docker build -f p6-research-agent/Dockerfile \
            -t ghcr.io/ahembal/research-agent-api:${{ github.sha }} \
            p6-research-agent/
          docker push ghcr.io/ahembal/research-agent-api:${{ github.sha }}
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  build-streamlit:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Streamlit
        run: |
          docker build -f p6-research-agent/Dockerfile.streamlit \
            -t ghcr.io/ahembal/research-agent-streamlit:${{ github.sha }} \
            p6-research-agent/
          docker push ghcr.io/ahembal/research-agent-streamlit:${{ github.sha }}

  update-tags:
    needs: [build-api, build-streamlit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tags in values.yaml
        run: |
          sed -i "s|tag: .*  # replaced by CI with full SHA|tag: ${{ github.sha }}   # replaced by CI with full SHA|g" \
            p6-research-agent/helm/research-agent/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add p6-research-agent/helm/research-agent/values.yaml
          git diff --staged --quiet || git commit -m "ci(p6): update image tags to ${GITHUB_SHA::7}"
          # Retry push once to handle concurrent workflow race. See runbooks/common-issues.md.
          git pull --rebase
          git push || (git pull --rebase && git push)
