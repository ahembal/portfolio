name: p4 — NLP Inference

on:
  push:
    branches: [main]
    paths:
      - "p4-nlp-deployment/**"
      - ".github/workflows/p4-ci.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nlp-inference-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p4-nlp-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -q fastapi httpx pytest pytest-cov pydantic prometheus-client \
            python-multipart boto3
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
      - name: Lint
        run: pip install -q ruff && ruff check serving/main.py tests/
      - name: Test
        run: PYTHONPATH=serving pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -f p4-nlp-deployment/serving/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            p4-nlp-deployment/
          docker push ${{ env.IMAGE }}:${{ github.sha }}

  update-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tag
        run: |
          sed -i "s|tag: .*  # replaced by CI with full SHA|tag: ${{ github.sha }}   # replaced by CI with full SHA|g" \
            p4-nlp-deployment/helm/nlp-inference/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add p4-nlp-deployment/helm/nlp-inference/values.yaml
          git diff --staged --quiet || git commit -m "ci(p4): update image tag to ${GITHUB_SHA::7}"
          git pull --rebase && git push
