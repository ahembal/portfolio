apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-browser
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahembal/ai-browser
    targetRevision: HEAD
    path: helm/ai-browser
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-browser
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
