apiVersion: v1
kind: Service
metadata:
  name: {{ include "p9-fuseki.fullname" . }}
  labels:
    app: {{ include "p9-fuseki.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "p9-fuseki.fullname" . }}
  ports:
    - name: sparql
      port: {{ .Values.service.port }}
      targetPort: 3030
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
