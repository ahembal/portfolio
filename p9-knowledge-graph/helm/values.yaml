image:
  repository: apache/jena-fuseki
  tag: "4.10.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 3030
  nodePort: 30900

# RGW location of graph.ttl — written by the builder Job.
# Credentials come from the p9-rgw-credentials K8s secret.
# Create before deploying:
#   kubectl create secret generic p9-rgw-credentials \
#     --from-literal=endpoint=http://<rgw-ip> \
#     --from-literal=access-key=<KEY> \
#     --from-literal=secret-key=<SECRET>
rgw:
  bucket: p9-graph
  key: graph.ttl

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

persistence:
  size: 2Gi
  storageClass: ""

adminPassword: "admin"
